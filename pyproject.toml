[project]
name = "kimi-usage-board"
version = "0.1.0"
description = "A shared-cache web dashboard for Kimi Coding Plan quota (multi-key)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
kimi-board = "kimi_usage_board.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kimi_usage_board"]
