<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kimi Code 额度看板</title>
<style>
  :root {
    --bg: #f2f4fa;
    --card: rgba(255, 255, 255, 0.75);
    --card-border: rgba(255, 255, 255, 0.9);
    --text: #1e2433;
    --text-dim: #7a8299;
    --accent1: #5b7fff;
    --accent2: #9b7bff;
    --ok: #10b981;
    --warn: #f59e0b;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "SF Pro Display", "Segoe UI", sans-serif;
    overflow-x: hidden;
  }
  /* 背景光斑 */
  .orb {
    position: fixed; border-radius: 50%; filter: blur(110px);
    opacity: 0.3; pointer-events: none; z-index: 0;
  }
  .orb1 { width: 480px; height: 480px; background: #bcd0ff; top: -140px; left: -120px; }
  .orb2 { width: 420px; height: 420px; background: #dcc9ff; bottom: -160px; right: -100px; }
  .orb3 { width: 300px; height: 300px; background: #b5e6ff; top: 40%; left: 55%; opacity: 0.35; }

  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 40px 20px 28px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 14px; margin-bottom: 28px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .moon {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    font-size: 22px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow: 0 6px 24px rgba(110, 139, 255, 0.4);
  }
  .brand h1 { font-size: 21px; font-weight: 700; letter-spacing: 0.5px; }
  .brand p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .controls { display: flex; align-items: center; gap: 14px; }
  #meta { font-size: 12px; color: var(--text-dim); text-align: right; line-height: 1.6; }
  #refreshBtn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow: 0 6px 20px rgba(110, 139, 255, 0.35);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  #refreshBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 26px rgba(110, 139, 255, 0.5); }
  #refreshBtn:disabled { opacity: 0.55; cursor: not-allowed; }
  #refreshBtn .spin { display: inline-block; }
  #refreshBtn.loading .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #cards {
    display: grid; gap: 22px;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px 24px 20px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 30px rgba(90, 110, 180, 0.10);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 12px 36px rgba(90, 110, 180, 0.16); }
  .card.err { border-color: rgba(239, 68, 68, 0.4); }

  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .card-title { display: flex; align-items: baseline; gap: 10px; }
  .card-title h2 { font-size: 18px; font-weight: 700; }
  .card-title .tail { font-size: 12px; color: var(--text-dim); font-family: "SF Mono", Menlo, monospace; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok   { color: var(--ok);   background: rgba(16, 185, 129, 0.10); }
  .badge.err  { color: var(--bad);  background: rgba(239, 68, 68, 0.10); }
  .badge.err .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* 环形仪表 */
  .gauge-block { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
  .gauge { position: relative; width: 128px; height: 128px; flex-shrink: 0; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .track { stroke: rgba(30, 36, 51, 0.08); }
  .gauge .bar { stroke-linecap: round; transition: stroke-dashoffset 0.8s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.4s; }
  .gauge .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .gauge .pct { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .gauge .pct small { font-size: 14px; font-weight: 600; color: var(--text-dim); }
  .gauge .cap { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .gauge-info { flex: 1; min-width: 0; }
  .gauge-info .label { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .gauge-info .nums { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .reset-line { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .reset-line b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* 条形额度 */
  .limit-row { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(30, 36, 51, 0.08); }
  .limit-row .lr-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .limit-row .lr-label { font-size: 13px; font-weight: 600; }
  .limit-row .lr-pct { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar-track {
    height: 8px; border-radius: 999px; background: rgba(30, 36, 51, 0.08);
    overflow: hidden; margin-bottom: 8px;
  }
  .bar-fill {
    height: 100%; border-radius: 999px; width: 0;
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s;
  }
  .limit-row .reset-line { margin-top: 2px; }

  .err-box {
    margin-top: 14px; padding: 10px 12px; border-radius: 10px;
    background: rgba(239, 68, 68, 0.07); border: 1px solid rgba(239, 68, 68, 0.25);
    color: var(--bad); font-size: 12px; line-height: 1.6;
    word-break: break-all;
  }
  .card-foot { margin-top: 16px; font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; }
  .stale-tag { color: var(--warn); }

  .empty {
    padding: 60px 0; text-align: center; color: var(--text-dim); font-size: 14px;
    grid-column: 1 / -1;
  }

  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(30, 36, 51, 0.08);
    color: var(--text); font-size: 13px; padding: 10px 18px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 10;
    box-shadow: 0 8px 30px rgba(90, 110, 180, 0.20);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-dim); line-height: 1.8; }

  /* 登录遮罩 */
  #loginOverlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(242, 244, 250, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transition: opacity 0.25s;
  }
  #loginOverlay.hidden { opacity: 0; pointer-events: none; }
  .login-card {
    width: min(360px, calc(100vw - 40px));
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 34px 30px 28px;
    text-align: center;
    box-shadow: 0 16px 50px rgba(90, 110, 180, 0.18);
  }
  .login-card .moon {
    width: 52px; height: 52px; border-radius: 15px; margin: 0 auto 14px;
    display: grid; place-items: center; font-size: 26px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow: 0 8px 24px rgba(110, 139, 255, 0.4);
  }
  .login-card h2 { font-size: 18px; font-weight: 700; }
  .login-card p { font-size: 13px; color: var(--text-dim); margin: 8px 0 18px; }
  #pwdInput {
    width: 100%; padding: 12px 14px; font-size: 14px;
    border: 1.5px solid rgba(30, 36, 51, 0.14); border-radius: 12px;
    outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    background: #fff; color: var(--text);
  }
  #pwdInput:focus {
    border-color: var(--accent1);
    box-shadow: 0 0 0 3px rgba(91, 127, 255, 0.15);
  }
  #loginErr { min-height: 20px; font-size: 12px; color: var(--bad); margin: 8px 0 6px; }
  #loginBtn {
    width: 100%; padding: 12px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow: 0 6px 20px rgba(110, 139, 255, 0.35);
    transition: transform 0.15s, opacity 0.15s;
  }
  #loginBtn:hover:not(:disabled) { transform: translateY(-1px); }
  #loginBtn:disabled { opacity: 0.55; cursor: not-allowed; }
  #logoutBtn {
    padding: 8px 14px; border-radius: 10px; cursor: pointer;
    font-size: 12px; color: var(--text-dim);
    background: transparent; border: 1px solid rgba(30, 36, 51, 0.14);
    transition: color 0.15s, border-color 0.15s;
  }
  #logoutBtn:hover { color: var(--bad); border-color: rgba(239, 68, 68, 0.4); }

  @media (max-width: 480px) {
    .wrap { padding: 24px 14px 20px; }
    .gauge-block { flex-direction: column; align-items: flex-start; }
    #meta { display: none; }
  }
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="wrap">
    <header>
      <div class="brand">
        <div class="moon">🌕</div>
        <div>
          <h1>Kimi Code 额度看板</h1>
          <p>Coding Plan 实时用量 · 多 Key 监控</p>
        </div>
      </div>
      <div class="controls">
        <div id="meta">加载中…</div>
        <button id="refreshBtn"><span class="spin">⟳</span> 刷新</button>
        <button id="logoutBtn">退出</button>
      </div>
    </header>

    <main id="cards"></main>

    <footer>
      数据来源：Kimi Code 官方接口 · 每 120 秒自动刷新 · 服务端共享缓存，多人访问不重复消耗上游请求
    </footer>
  </div>

  <div id="toast"></div>

  <div id="loginOverlay" class="hidden">
    <div class="login-card">
      <div class="moon">🌕</div>
      <h2>Kimi Code 额度看板</h2>
      <p>此页面受密码保护，请输入访问密码</p>
      <input type="password" id="pwdInput" placeholder="访问密码" autocomplete="current-password">
      <div id="loginErr"></div>
      <button id="loginBtn">进入看板</button>
    </div>
  </div>

<script>
const AUTO_REFRESH_SEC = 120;
const GAUGE_R = 54;
const GAUGE_C = 2 * Math.PI * GAUGE_R;

let nextAutoAt = Date.now() + AUTO_REFRESH_SEC * 1000;
let loading = false;
let toastTimer = null;

const $cards = document.getElementById('cards');
const $meta = document.getElementById('meta');
const $btn = document.getElementById('refreshBtn');
const $overlay = document.getElementById('loginOverlay');
const $pwd = document.getElementById('pwdInput');
const $loginBtn = document.getElementById('loginBtn');
const $loginErr = document.getElementById('loginErr');

function showLogin() {
  $overlay.classList.remove('hidden');
  $pwd.value = '';
  $loginErr.textContent = '';
  setTimeout(() => $pwd.focus(), 100);
}
function hideLogin() { $overlay.classList.add('hidden'); }

async function api(path, opts) {
  const resp = await fetch(path, opts);
  if (resp.status === 401) {
    showLogin();
    const err = new Error('unauthorized');
    err.unauthorized = true;
    throw err;
  }
  return resp;
}

async function doLogin() {
  const password = $pwd.value;
  if (!password) { $loginErr.textContent = '请输入密码'; return; }
  $loginBtn.disabled = true;
  $loginErr.textContent = '';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await resp.json().catch(() => ({}));
    if (resp.ok && data.ok) {
      hideLogin();
      nextAutoAt = Date.now() + AUTO_REFRESH_SEC * 1000;
      load(false);
    } else {
      $loginErr.textContent = data.error || '登录失败';
      $pwd.select();
    }
  } catch (e) {
    $loginErr.textContent = `网络错误：${e.message}`;
  } finally {
    $loginBtn.disabled = false;
  }
}

$loginBtn.addEventListener('click', doLogin);
$pwd.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' }).catch(() => {});
  $cards.innerHTML = '';
  showLogin();
});

function zhLabel(label) {
  if (/weekly/i.test(label)) return '每周用量';
  const h = label.match(/^(\d+)\s*h/i);
  if (h) return `${h[1]} 小时限额`;
  const d = label.match(/^(\d+)\s*d/i);
  if (d) return `${d[1]} 天限额`;
  if (/limit/i.test(label)) return '限额';
  return label;
}

function colorFor(pct) {
  if (pct >= 85) return 'var(--bad)';
  if (pct >= 60) return 'var(--warn)';
  return 'var(--ok)';
}

function fmtCountdown(iso) {
  if (!iso) return null;
  const diff = new Date(iso) - Date.now();
  if (diff <= 0) return '即将重置';
  const s = Math.floor(diff / 1000);
  const days = Math.floor(s / 86400);
  const hours = Math.floor((s % 86400) / 3600);
  const mins = Math.floor((s % 3600) / 60);
  const secs = s % 60;
  if (days > 0) return `${days}天 ${hours}小时`;
  if (hours > 0) return `${hours}小时 ${mins}分`;
  return `${mins}分 ${secs}秒`;
}

function gaugeSVG(pct) {
  const clamped = Math.min(100, Math.max(0, pct));
  const offset = GAUGE_C * (1 - clamped / 100);
  const color = colorFor(pct);
  return `
    <div class="gauge">
      <svg width="128" height="128" viewBox="0 0 128 128">
        <defs>
          <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6e8bff"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="64" cy="64" r="${GAUGE_R}" fill="none" stroke-width="10"/>
        <circle class="bar" cx="64" cy="64" r="${GAUGE_R}" fill="none" stroke-width="10"
          stroke="${clamped >= 60 ? color : 'url(#gg)'}"
          stroke-dasharray="${GAUGE_C}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="center">
        <div class="pct" style="color:${color}">${pct.toFixed(1)}<small>%</small></div>
        <div class="cap">已使用</div>
      </div>
    </div>`;
}

function resetLine(row) {
  if (!row.reset_display) return '';
  return `
    <div class="reset-line">
      ⏱ ${row.reset_display} 重置
      <b data-reset-iso="${row.reset_iso || ''}">${fmtCountdown(row.reset_iso) || ''}</b>
    </div>`;
}

function limitRowHTML(row) {
  const color = colorFor(row.percent);
  return `
    <div class="limit-row">
      <div class="lr-head">
        <span class="lr-label">${zhLabel(row.label)}</span>
        <span class="lr-pct" style="color:${color}">${row.percent.toFixed(1)}%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.min(100, row.percent)}%;background:${color}"></div>
      </div>
      ${resetLine(row)}
    </div>`;
}

function cardHTML(k) {
  const rows = k.rows || [];
  // 5h 限额更重要：作为大仪表展示；周额度及其他限额用进度条
  const fiveHour = rows.find(r => /^\d+\s*h/i.test(r.label));
  const primary = fiveHour || rows[0];
  const secondary = rows.filter(r => r !== primary);
  const ok = k.ok;
  const updated = k.fetched_at ? new Date(k.fetched_at).toLocaleTimeString('zh-CN', {hour12: false}) : '--';

  let body;
  if (!primary) {
    body = `<div class="empty">暂无用量数据</div>`;
  } else {
    body = `
      <div class="gauge-block">
        ${gaugeSVG(primary.percent)}
        <div class="gauge-info">
          <div class="label">${zhLabel(primary.label)}</div>
          <div class="nums">${primary.used} / ${primary.limit}（剩余 ${Math.max(0, primary.limit - primary.used)}）</div>
          ${resetLine(primary)}
        </div>
      </div>
      ${secondary.map(limitRowHTML).join('')}`;
  }

  return `
    <div class="card ${ok ? '' : 'err'}">
      <div class="card-head">
        <div class="card-title">
          <h2>${k.name}</h2>
          <span class="tail">${k.tail}</span>
        </div>
        <span class="badge ${ok ? 'ok' : 'err'}"><span class="dot"></span>${ok ? '正常' : '异常'}</span>
      </div>
      ${body}
      ${k.error ? `<div class="err-box">⚠ ${k.error}</div>` : ''}
      <div class="card-foot">
        <span>更新于 ${updated}</span>
        ${k.stale ? '<span class="stale-tag">⚠ 数据可能已过期</span>' : ''}
      </div>
    </div>`;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function render(data) {
  const keys = data.keys || [];
  $cards.innerHTML = keys.length
    ? keys.map(cardHTML).join('')
    : '<div class="empty">服务端未配置任何 Key</div>';
  if (keys.some(k => k.rate_limited)) {
    toast('刷新过于频繁，已返回缓存数据（15 秒内仅允许一次手动刷新）');
  } else if (keys.length && keys.every(k => k.ok)) {
    toast('已刷新 ✓');
  }
}

function updateMeta() {
  const remain = Math.max(0, Math.round((nextAutoAt - Date.now()) / 1000));
  $meta.innerHTML = `每 ${AUTO_REFRESH_SEC} 秒自动刷新<br>${remain}s 后刷新`;
}

async function load(force) {
  if (loading) return;
  loading = true;
  $btn.disabled = true;
  $btn.classList.add('loading');
  try {
    const resp = await api(force ? '/api/refresh' : '/api/usage', { method: force ? 'POST' : 'GET' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    render(await resp.json());
    nextAutoAt = Date.now() + AUTO_REFRESH_SEC * 1000;
  } catch (e) {
    if (!e.unauthorized) toast(`请求失败：${e.message}`);
  } finally {
    loading = false;
    $btn.disabled = false;
    $btn.classList.remove('loading');
    updateMeta();
  }
}

// 每秒：更新自动刷新倒计时 + 卡片内的重置倒计时
setInterval(() => {
  // 登录遮罩显示期间不轮询，避免持续打 401
  if (Date.now() >= nextAutoAt) {
    if ($overlay.classList.contains('hidden')) load(false);
    return;
  }
  updateMeta();
  document.querySelectorAll('[data-reset-iso]').forEach(el => {
    const iso = el.dataset.resetIso;
    if (iso) el.textContent = fmtCountdown(iso) || '';
  });
}, 1000);

$btn.addEventListener('click', () => load(true));
load(false);
</script>
</body>
</html>
